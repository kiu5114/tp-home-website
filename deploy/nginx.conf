# =====================================================================
# TP 全屋家居 · Nginx 网关配置
# ---------------------------------------------------------------------
# 功能：
#  - 托管前台(web)与后台(admin)静态资源
#  - 反向代理 /api 到后端 FastAPI（统一网关入口）
#  - 反向代理 /uploads 到后端静态文件（上传的图片/文件）
#  - SPA History 路由回退：未命中文件时回退到 index.html
# ---------------------------------------------------------------------
# 部署位置：deploy/nginx.conf（由 docker-compose 挂载为 default.conf）
# =====================================================================

server {
    listen 80;
    server_name _;

    # 上传文件代理：/uploads/xxx → 后端 :8000/uploads/xxx
    location /uploads/ {
        proxy_pass http://api:8000/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # API 代理：/api/* → 后端 :8000/api/*
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # API 响应可能较大（列表/导出），放宽超时
        proxy_read_timeout 60s;
    }

    # 后台管理：/admin/* → admin 静态包 + History 回退
    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        index index.html;
        # SPA 路由回退：文件不存在时返回 index.html
        try_files $uri $uri/ /admin/index.html;
    }
    # 后台根路径（/admin 无斜杠时跳转）
    location = /admin {
        return 301 /admin/;
    }

    # 前台站点：/ → web 静态包 + History 回退
    location / {
        root /usr/share/nginx/html/web;
        index index.html;
        # SPA 路由回退（/products /about 等前端路由）
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存（带 hash 的构建产物可长缓存）
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
