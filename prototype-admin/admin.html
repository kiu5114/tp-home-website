<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TP 全屋家居 · 后台管理系统</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
  :root{
    --ink:#1A1714; --ink-2:#2b2620; --sand:#FAF8F5;
    --gold:#B08D57; --gold-2:#C9A875;
    --bg:#F0F2F5; --border:#f0f0f0; --border-2:#e8e8e8;
    --text:#262626; --text-2:#595959; --text-3:#8c8c8c;
    --primary:#B08D57; --primary-hover:#C9A875;
    --success:#52c41a; --warning:#faad14; --error:#ff4d4f; --blue:#1677ff;
    --sider-w:224px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{font-family:"Noto Sans SC",-apple-system,"PingFang SC",sans-serif;background:var(--bg);color:var(--text);font-size:14px;}
  .layout{display:flex;min-height:100vh;}
  /* ===== Sider ===== */
  .sider{width:var(--sider-w);background:var(--ink);color:#FAF8F5;position:fixed;top:0;left:0;bottom:0;display:flex;flex-direction:column;transition:width .2s;z-index:20;}
  .sider.collapsed{width:80px;}
  .logo{height:64px;display:flex;align-items:center;gap:10px;padding:0 20px;color:#fff;border-bottom:1px solid rgba(255,255,255,.08);}
  .logo .mark{font-family:"Noto Serif SC",serif;font-size:24px;font-weight:700;letter-spacing:.15em;color:#fff;}
  .logo .txt{font-size:14px;color:#B08D57;letter-spacing:.18em;white-space:nowrap;}
  .sider.collapsed .logo .txt,.sider.collapsed .m-title .t,.sider.collapsed .m-title .chev{display:none;}
  .menu{flex:1;overflow-y:auto;padding:10px 0;}
  .menu::-webkit-scrollbar{width:6px;}
  .menu::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:3px;}
  .m-group{margin-bottom:2px;}
  .m-title{display:flex;align-items:center;justify-content:space-between;padding:11px 20px;font-size:13px;color:rgba(250,248,245,.55);cursor:pointer;user-select:none;}
  .m-title .chev{transition:transform .2s;font-size:10px;}
  .m-group.open .m-title .chev{transform:rotate(90deg);}
  .m-items{display:none;}
  .m-group.open .m-items{display:block;}
  .m-item{display:block;padding:10px 20px 10px 34px;font-size:14px;color:rgba(250,248,245,.78);cursor:pointer;position:relative;transition:all .15s;}
  .m-item:hover{color:#fff;background:rgba(255,255,255,.06);}
  .m-item.active{color:#fff;background:rgba(176,141,87,.16);}
  .m-item.active::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gold);}
  .sider.collapsed .m-item{padding-left:0;text-align:center;}
  .sider-foot{height:48px;border-top:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;gap:8px;color:rgba(250,248,245,.5);font-size:12px;cursor:pointer;}
  .sider-foot:hover{color:#fff;}
  /* ===== Main ===== */
  .main{margin-left:var(--sider-w);flex:1;display:flex;flex-direction:column;transition:margin .2s;min-width:0;}
  .sider.collapsed ~ .main{margin-left:80px;}
  .header{height:64px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:10;}
  .header-left{display:flex;align-items:center;gap:16px;}
  .collapse-btn{cursor:pointer;color:var(--text-2);font-size:18px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:6px;}
  .collapse-btn:hover{background:var(--bg);}
  .breadcrumb{color:var(--text-3);font-size:13px;}
  .breadcrumb b{color:var(--text);font-weight:500;}
  .header-right{display:flex;align-items:center;gap:18px;}
  .header-right .ic{color:var(--text-2);cursor:pointer;font-size:16px;position:relative;}
  .badge{position:absolute;top:-4px;right:-6px;background:var(--error);color:#fff;font-size:10px;border-radius:8px;padding:0 4px;line-height:14px;}
  .user{display:flex;align-items:center;gap:8px;cursor:pointer;position:relative;}
  .avatar{width:32px;height:32px;border-radius:50%;background:var(--gold);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;}
  .user .name{font-size:13px;color:var(--text);}
  .user .role{font-size:11px;color:var(--text-3);}
  .user-menu{position:absolute;top:42px;right:0;background:#fff;border:1px solid var(--border);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.12);width:160px;display:none;overflow:hidden;z-index:30;}
  .user-menu.show{display:block;}
  .user-menu div{padding:10px 16px;font-size:13px;color:var(--text-2);cursor:pointer;}
  .user-menu div:hover{background:var(--bg);color:var(--gold);}
  .content{padding:24px;flex:1;}
  /* ===== Components ===== */
  .page-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:12px;}
  .page-title{font-size:20px;font-weight:600;color:var(--text);}
  .page-desc{font-size:13px;color:var(--text-3);margin-top:4px;}
  .page-extra{display:flex;gap:10px;flex-wrap:wrap;}
  .card{background:#fff;border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.04);margin-bottom:18px;}
  .card-head{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
  .card-head .h{font-size:15px;font-weight:600;}
  .card-body{padding:20px;}
  .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:18px;}
  .stat{background:#fff;border-radius:10px;padding:18px 20px;box-shadow:0 1px 3px rgba(0,0,0,.04);border-left:3px solid var(--gold);}
  .stat .t{font-size:13px;color:var(--text-3);}
  .stat .v{font-size:28px;font-weight:600;margin-top:6px;color:var(--text);}
  .stat .v.blue{color:var(--blue);} .stat .v.green{color:var(--success);} .stat .v.gold{color:var(--gold);} .stat .v.red{color:var(--error);}
  .stat .s{font-size:14px;color:var(--text-3);font-weight:400;margin-left:4px;}
  .toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .toolbar .spacer{flex:1;}
  select.ipt,input.ipt{height:34px;border:1px solid var(--border-2);border-radius:6px;padding:0 10px;font-size:13px;outline:none;background:#fff;color:var(--text);}
  input.ipt{width:200px;} select.ipt{min-width:140px;}
  select.ipt:focus,input.ipt:focus{border-color:var(--gold);}
  .btn{height:34px;padding:0 16px;border-radius:6px;font-size:13px;cursor:pointer;border:1px solid var(--border-2);background:#fff;color:var(--text-2);transition:.15s;display:inline-flex;align-items:center;gap:6px;}
  .btn:hover{border-color:var(--gold);color:var(--gold);}
  .btn.primary{background:var(--gold);border-color:var(--gold);color:#fff;}
  .btn.primary:hover{background:var(--gold-2);border-color:var(--gold-2);color:#fff;}
  .btn.danger{color:var(--error);border-color:#ffccc7;}
  .btn.danger:hover{background:#fff1f0;border-color:var(--error);}
  .btn.sm{height:28px;padding:0 10px;font-size:12px;}
  table.ant{width:100%;border-collapse:collapse;font-size:13px;background:#fff;}
  table.ant th{background:#fafafa;text-align:left;padding:12px 14px;font-weight:600;color:var(--text-2);border-bottom:1px solid var(--border);white-space:nowrap;}
  table.ant td{padding:12px 14px;border-bottom:1px solid var(--border);color:var(--text);vertical-align:middle;}
  table.ant tr:hover td{background:#fcfaf6;}
  .ant-empty{text-align:center;color:var(--text-3);padding:36px 0;}
  .tag{display:inline-flex;align-items:center;padding:1px 9px;border-radius:4px;font-size:12px;line-height:20px;border:1px solid transparent;white-space:nowrap;}
  .tag.green{color:#389e0d;background:#f6ffed;border-color:#b7eb8f;}
  .tag.gold{color:#ad6800;background:#fffbe6;border-color:#ffe58f;}
  .tag.blue{color:#0958d9;background:#e6f4ff;border-color:#91caff;}
  .tag.red{color:#cf1322;background:#fff1f0;border-color:#ffa39e;}
  .tag.gray{color:#595959;background:#fafafa;border-color:#d9d9d9;}
  .tag.orange{color:#d46b08;background:#fff7e6;border-color:#ffd591;}
  .link{color:var(--blue);cursor:pointer;margin-right:10px;}
  .link:hover{text-decoration:underline;}
  .link.danger{color:var(--error);}
  .pager{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:14px;color:var(--text-3);font-size:13px;}
  .pager .pg{padding:4px 10px;border:1px solid var(--border-2);border-radius:5px;cursor:pointer;}
  .pager .pg.active{background:var(--gold);border-color:var(--gold);color:#fff;}
  .filter-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:#fafafa;border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:16px;}
  .filter-bar .fitem{display:flex;flex-direction:column;gap:4px;}
  .filter-bar label{font-size:12px;color:var(--text-3);}
  /* ===== Modal ===== */
  .modal-root{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:100;}
  .modal-root.show{display:flex;}
  .ant-modal{background:#fff;border-radius:10px;width:520px;max-width:94vw;max-height:90vh;overflow:auto;box-shadow:0 12px 40px rgba(0,0,0,.25);}
  .modal-head{padding:16px 20px;border-bottom:1px solid var(--border);font-size:16px;font-weight:600;display:flex;justify-content:space-between;align-items:center;}
  .modal-head .x{cursor:pointer;color:var(--text-3);font-size:18px;}
  .modal-body{padding:20px;}
  .modal-foot{padding:12px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;}
  .form-row{margin-bottom:16px;}
  .form-row label{display:block;font-size:13px;color:var(--text-2);margin-bottom:6px;}
  .form-row label .req{color:var(--error);margin-right:2px;}
  .form-row input,.form-row select,.form-row textarea{width:100%;border:1px solid var(--border-2);border-radius:6px;padding:8px 10px;font-size:13px;outline:none;font-family:inherit;color:var(--text);}
  .form-row input:focus,.form-row select:focus,.form-row textarea:focus{border-color:var(--gold);}
  .form-row textarea{resize:vertical;min-height:80px;}
  .form-row .hint{font-size:12px;color:var(--text-3);margin-top:4px;}
  .switch{position:relative;display:inline-block;width:44px;height:24px;}
  .switch input{opacity:0;width:0;height:0;}
  .switch .slider{position:absolute;inset:0;background:#ccc;border-radius:24px;transition:.2s;cursor:pointer;}
  .switch .slider:before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;}
  .switch input:checked + .slider{background:var(--gold);}
  .switch input:checked + .slider:before{transform:translateX(20px);}
  .upload{position:relative;overflow:hidden;border:1px dashed var(--border-2);border-radius:8px;padding:18px;text-align:center;color:var(--text-3);cursor:pointer;background:#fafafa;min-height:80px;display:flex;align-items:center;justify-content:center;}
  .upload:hover{border-color:var(--gold);color:var(--gold);}
  .upload.has-img{border-style:solid;border-color:var(--gold);color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.5);}
  .upload .file-input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;z-index:2;}
  .upload .up-tip{position:absolute;left:0;right:0;bottom:0;background:rgba(26,23,20,.7);color:#fff;font-size:12px;padding:4px 8px;z-index:3;}
  .perm-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .perm-item{border:1px solid var(--border-2);border-radius:8px;padding:12px;}
  .perm-item .ph{font-weight:600;margin-bottom:8px;font-size:13px;}
  .perm-item label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-2);margin-bottom:6px;cursor:pointer;}
  .rec-picker{max-height:52vh;overflow:auto;border:1px solid var(--border);border-radius:8px;}
  .rec-picker table.ant td{padding:10px 12px;}
  .rec-picker table.ant input[type="number"]{width:70px;padding:4px 6px;text-align:center;}
  .rec-picker .rec-check{width:18px;height:18px;accent-color:var(--gold);cursor:pointer;}
  .timeline{position:relative;padding-left:24px;}
  .timeline:before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--border-2);}
  .tl-item{position:relative;margin-bottom:18px;}
  .tl-item:before{content:"";position:absolute;left:-21px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--gold);border:2px solid #fff;box-shadow:0 0 0 2px var(--gold);}
  .tl-year{font-weight:600;color:var(--gold);}
  .tl-title{font-weight:500;margin:2px 0;}
  .tl-desc{font-size:13px;color:var(--text-3);}
  .chart{width:100%;height:320px;}
  .quick-list{list-style:none;}
  .quick-list li{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--border);font-size:13px;}
  .quick-list li:last-child{border-bottom:none;}
  .role-tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:10px;background:rgba(176,141,87,.15);color:var(--gold);margin-left:6px;}
  .hidden{display:none;}
  @media(max-width:1100px){.stat-grid{grid-template-columns:repeat(2,1fr);} .perm-grid{grid-template-columns:1fr;}}
  @media(max-width:768px){.stat-grid{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="layout">
  <!-- Sider -->
  <aside class="sider" id="sider">
    <div class="logo">
      <span class="mark">TP</span>
      <span class="txt">全屋家居</span>
    </div>
    <nav class="menu" id="menu"></nav>
    <div class="sider-foot" onclick="toggleSider()">
      <span id="collapseText">⟨ 收起</span>
    </div>
  </aside>

  <!-- Main -->
  <div class="main">
    <header class="header">
      <div class="header-left">
        <span class="collapse-btn" onclick="toggleSider()">☰</span>
        <div class="breadcrumb" id="breadcrumb">工作台 / <b>数据看板</b></div>
      </div>
      <div class="header-right">
        <span class="ic" title="搜索">🔍</span>
        <span class="ic" title="通知">🔔<span class="badge" id="notifBadge">5</span></span>
        <div class="user" onclick="toggleUserMenu(event)">
          <span class="avatar" id="avatar">A</span>
          <span>
            <span class="name" id="uname">admin</span><br/>
            <span class="role" id="urole">超级管理员</span>
          </span>
          <div class="user-menu" id="userMenu">
            <div onclick="showView('profile')">个人中心</div>
            <div onclick="logout()">退出登录</div>
          </div>
        </div>
      </div>
    </header>

    <main class="content" id="content"></main>
  </div>
</div>

<!-- Modal -->
<div class="modal-root" id="modalRoot" onclick="if(event.target===this)closeModal()">
  <div class="ant-modal" id="modalBox">
    <div class="modal-head"><span id="modalTitle">标题</span><span class="x" onclick="closeModal()">✕</span></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<script src="js/api.js"></script>
<script>
/* ============ 菜单结构（严格对应 PRD §6 模块） ============ */
const MENU = [
  {id:'dashboard', name:'数据看板', icon:'📊'},
  {group:'内容管理', open:true, children:[
    {group:'首页配置', children:[
      {id:'home-banner', name:'轮播图管理'},
      {id:'home-highlight', name:'品牌工艺亮点'},
      {id:'home-rec-prod', name:'推荐产品'},
      {id:'home-rec-case', name:'推荐案例'},

    {group:'产品管理', children:[

      {id:'prod-item', name:'单品管理'},
    ]},

      {id:'case-list', name:'案例列表'},

    {id:'sys-setting', name:'系统设置'},
  ]},
];

const VIEW_META = {
  'dashboard':['工作台','数据看板'],
  'home-banner':['内容管理 / 首页配置','轮播图管理'],
  'home-highlight':['内容管理 / 首页配置','品牌工艺亮点'],
  'home-rec-prod':['内容管理 / 首页配置','推荐产品'],
  'home-rec-case':['内容管理 / 首页配置','推荐案例'],
  'prod-series':['内容管理 / 产品管理','产品系列'],
  'prod-space':['内容管理 / 产品管理','空间场景分类'],
  'prod-item':['内容管理 / 产品管理','单品管理'],
  'case-list':['内容管理 / 案例管理','案例列表'],
  'case-space':['内容管理 / 案例管理','案例空间分类'],
  'news-cat':['内容管理 / 新闻管理','新闻分类'],
  'news-article':['内容管理 / 新闻管理','文章管理'],
  'about-tp':['内容管理 / 关于我们','关于TP'],
  'about-brand':['内容管理 / 关于我们','品牌介绍'],
  'about-milestone':['内容管理 / 关于我们','发展历程'],
  'about-contact':['内容管理 / 关于我们','联系信息'],
  'job-post':['业务管理 / 招聘管理','职位管理'],
  'job-apply':['业务管理 / 招聘管理','投递管理'],
  'store':['业务管理','门店管理'],
  'lead':['业务管理','留言/预约管理'],
  'sys-admin':['系统管理','管理员账号'],
  'sys-role':['系统管理','角色权限'],
  'sys-log':['系统管理','操作日志'],
  'sys-setting':['系统管理','系统设置'],
  'profile':['个人中心','修改密码'],
};

/* ============ 通用组件 ============ */
function pageHead(title,desc,extra){return `<div class="page-head"><div><div class="page-title">${title}</div>${desc?`<div class="page-desc">${desc}</div>`:''}</div>${extra?`<div class="page-extra">${extra}</div>`:''}</div>`;}
function card(head,body,extra){return `<div class="card"><div class="card-head"><span class="h">${head}</span>${extra||''}</div><div class="card-body">${body}</div></div>`;}
function stat(t,v,s,tone){return `<div class="stat"><div class="t">${t}</div><div class="v ${tone||''}">${v}${s?`<span class="s">${s}</span>`:''}</div></div>`;}
function tag(text,color){return `<span class="tag ${color||'gray'}">${text}</span>`;}
function table(cols,rows,empty){let h='<table class="ant"><thead><tr>';cols.forEach(c=>h+=`<th>${c.label}</th>`);h+='</tr></thead><tbody>';if(!rows||!rows.length){h+=`<tr><td class="ant-empty" colspan="${cols.length}">${empty||'暂无数据'}</td></tr>`;}else{rows.forEach(r=>{h+='<tr>';cols.forEach(c=>{let v=r[c.key];if(c.render)v=c.render(r);h+=`<td>${v==null?'':v}</td>`;});h+='</tr>';});}h+='</tbody></table>';return h;}
function pager(){return `<div class="pager"><span>共 1 页</span><span class="pg active">1</span><span class="pg">下一页</span></div>`;}

/* ============ 示例数据 ============ */
const data = {
  banners:[
    {id:1,title:'一站式全屋定制',sub:'为家定义专属风格',sort:1,status:1,img:'Banner-01.jpg'},
    {id:2,title:'2026 新品系列发布',sub:'胡桃禮 · 如意春',sort:2,status:1,img:'Banner-02.jpg'},
    {id:3,title:'到店体验空间',sub:'预约设计师 1v1',sort:3,status:1,img:'Banner-03.jpg'},
  ],
  highlights:[

const A = window.adminApi;

function $(id){ return document.getElementById(id); }
async function g(fn,def){ try{ return await fn(); }catch(e){ console.warn('[TP] 接口不可用，使用本地数据：',e.message); return def; } }

// 把后端原始数据适配为 admin 展示字段；后端不可达时保持内置 mock 不变
async function loadAll(){
  const tok=sessionStorage.getItem('tp_admin_token');
  if(!tok){ window.location.href='admin-login.html'; return; }
  const probe=await g(A.banners,null);
  if(probe===null) return; // 后端未连接：保留 mock 数据演示
  const raw={ banners: probe };
  const rest=['highlights','series','spaces','products','cases','newsCats','news','milestones','jobs','applies','stores','leads','admins'];
  await Promise.all(rest.map(async k=>{ raw[k]=await g(A[k],[]); }));
  const sName=id=>{const x=data.series.find(y=>y.id===id);return x?x.name:'';};
  const spName=id=>{const x=data.spaces.find(y=>y.id===id);return x?x.name:'';};
  const cName=id=>{const x=data.newsCats.find(y=>y.id===id);return x?x.name:'';};
  data.banners     = raw.banners.map(b=>({id:b.id,title:b.title,sub:b.subtitle||'',link:b.link||'',sort:b.sort,status:b.status?1:0,img:b.img_url||''}));
  data.highlights  = raw.highlights.map(h=>({id:h.id,icon:h.icon||'',title:h.title,desc:h.desc||'',sort:h.sort,status:h.status?1:0}));
  data.series      = raw.series.map(s=>({id:s.id,name:s.name,desc:s.desc||'',cover:s.cover||'',sort:s.sort,status:s.status?1:0}));
  data.spaces      = raw.spaces.map(s=>({id:s.id,name:s.name,scope:s.scope||'all',sort:s.sort,status:s.status?1:0}));
  data.products    = raw.products.map(p=>({id:p.id,code:p.code||'',name:p.name,series_id:p.series_id||null,space_id:p.space_id||null,series:sName(p.series_id),space:spName(p.space_id),material:p.material||'',dim:p.dimensions||'',desc:p.description||'',img:p.images||'',sort:p.sort,status:p.status?1:0,reco:p.is_recommended?1:0}));
  data.cases       = raw.cases.map(c=>({id:c.id,title:c.title,space:spName(c.space_id),area:c.area||'',style:c.style||'',customer:c.customer||'',house_type:c.house_type||'',series:c.series||'',desc:c.description||'',img:c.images||'',sort:c.sort,status:c.status?1:0,reco:c.is_recommended?1:0}));
  data.newsCats    = raw.newsCats.map(c=>({id:c.id,name:c.name,status:c.status?1:0}));
  data.news        = raw.news.map(n=>({id:n.id,title:n.title,cat:cName(n.category_id),author:n.author||'',published:n.published_at?String(n.published_at).slice(0,10):'',status:n.status?1:0}));
  data.milestones  = raw.milestones.map(m=>({id:m.id,year:m.year||'',title:m.title||'',desc:m.description||''}));
  data.jobs        = raw.jobs.map(j=>({id:j.id,title:j.title,type:j.job_type||'social',dept:j.department||'',loc:j.location||'',emp:j.employment_type||'',sort:j.sort,status:j.status?1:0}));
  data.applies     = raw.applies.map(a=>({id:a.id,name:a.name,phone:a.phone,position:a.position||'',msg:a.message||'',time:a.created_at?String(a.created_at).replace('T',' ').slice(0,16):'',status:a.status||'未处理'}));
  data.stores      = raw.stores.map(s=>({id:s.id,name:s.name,addr:s.address||'',phone:s.phone||'',hours:s.hours||'',status:s.status?1:0}));
  data.leads       = raw.leads.map(l=>({id:l.id,name:l.name,phone:l.phone,city:l.city||'',rtype:l.requirement_type||'',store:l.store||'',msg:l.message||'',time:l.created_at?String(l.created_at).replace('T',' ').slice(0,16):'',status:l.status||'未处理'}));
  data.admins      = raw.admins.map(a=>({id:a.id,username:a.username,real:a.real_name||'',role:a.role||'',status:a.status?1:0,last:a.last_login?String(a.last_login).replace('T',' ').slice(0,16):''}));
}

function newsCatIdByName(n){ const x=data.newsCats.find(c=>c.name===n); return x?x.id:null; }

/* 单品管理筛选状态 */
let prodFilter={series:'all',space:'all',status:'all',kw:''};
function prodFiltered(){
  return data.products.filter(p=>{
    const sMatch=prodFilter.series==='all'||String(p.series_id)===String(prodFilter.series);
    const spMatch=prodFilter.space==='all'||String(p.space_id)===String(prodFilter.space);
    const stMatch=prodFilter.status==='all'||String(p.status)===(prodFilter.status==='上线'?'1':'0');
    const kwMatch=!prodFilter.kw||p.name.includes(prodFilter.kw)||p.code.includes(prodFilter.kw);
    return sMatch&&spMatch&&stMatch&&kwMatch;
  });
}

async function saveBanner(){
  const id=+$('bannerId').value||0;
  if(!$('bannerTitle').value.trim()){ alert('请输入标题'); return; }
  const payload={ title:$('bannerTitle').value, subtitle:$('bannerSub').value, link:$('bannerLink').value, sort:(+$('bannerSort').value)||0, status:$('bannerStatus').checked };
  const up=document.querySelector('#modalBody .upload'); const fi=up?up.querySelector('input[type=file]'):null;
  if(fi&&fi.files[0]){
    try{ const u=await A.upload(fi.files[0]); payload.img_url=u.url; }
    catch(e){ alert('图片上传失败：'+e.message); return; }
  }
  else if(id){ payload.img_url=(data.banners.find(b=>b.id===id)||{}).img||''; }
  else { payload.img_url=''; }
  try{ if(id) await A.updateBanner(id,payload); else await A.createBanner(payload); closeModal(); await reload(); }
  catch(e){ alert('保存失败：'+e.message); }
}

async function saveSeries(){
  const id=+$('seriesId').value||0;
  if(!$('seriesName').value.trim()){ alert('请输入系列名称'); return; }
  const payload={ name:$('seriesName').value, desc:$('seriesDesc').value, sort:(+$('seriesSort').value)||0, status:$('seriesStatus').checked };
  const up=document.querySelector('#modalBody .upload'); const fi=up?up.querySelector('input[type=file]'):null;
  if(fi&&fi.files[0]){
    try{ const u=await A.upload(fi.files[0]); payload.cover=u.url; }
    catch(e){ alert('图片上传失败：'+e.message); return; }
  }
  else if(id){ payload.cover=(data.series.find(s=>s.id===id)||{}).cover||''; }
  else { payload.cover=''; }
  try{
    if(id){
      await A.updateSeries(id,payload); closeModal(); await reload();
    } else {
      const created=await A.createSeries(payload);
      closeModal(); await reload();
      if(created && created.id && data.products.filter(p=>p.series_id===created.id).length===0){
        if(confirm('系列已保存。该系列下暂无产品，前台产品中心不会展示，是否立即添加产品？')) editProduct(0, created.id);

  catch(e){ alert('保存失败：'+e.message); }
}

    ${stat('在招职位',data.jobs.length,'个','')}
  </div>`,'BE-DASH-03');
  const pendingItems=data.leads.filter(l=>l.status==='未处理').concat(data.applies.filter(a=>a.status==='未处理')).slice(0,10);
  const pending=card('待处理线索 / 投递（最近 10 条）',`<ul class="quick-list">
    ${pendingItems.map(x=>{const isLead=!!x.rtype;const fn=isLead?'leadDetail':'applyDetail';return `<li><span>${x.name} · ${x.rtype||x.position}</span><span class="link" onclick="${fn}(${x.id})">去处理</span></li>`;}).join('')||'<li style="color:#8c8c8c">暂无待处理</li>'}
  </ul>`,'BE-DASH-04');
  // 渲染后初始化图表
  setTimeout(renderTrend,50);
  return head+stats+`<div style="display:grid;grid-template-columns:1.6fr 1fr;gap:18px">${trend}${pending}</div>`+content;
}
function renderTrend(range){
  const el=document.getElementById('trendChart'); if(!el) return;
  if(typeof echarts==='undefined'){ el.innerHTML='<div class="ant-empty">趋势图（ECharts 需联网加载；离线时此处显示占位）</div>'; return; }
  const n=range==='7'?7:30;
  const x=[],msg=[],store=[],job=[];
  for(let i=n;i>0;i--){ x.push((i===1?'今天':('D-'+(i-1)))); msg.push(Math.round(8+Math.random()*14)); store.push(Math.round(3+Math.random()*8)); job.push(Math.round(2+Math.random()*6)); }
  const ch=echarts.init(el);
  ch.setOption({
    tooltip:{trigger:'axis'},legend:{data:['在线留言','预约到店','招聘投递'],bottom:0},
    grid:{left:40,right:20,top:20,bottom:40},
    xAxis:{type:'category',data:x,axisLabel:{color:'#8c8c8c'}},
    yAxis:{type:'value',axisLabel:{color:'#8c8c8c'},splitLine:{lineStyle:{color:'#f0f0f0'}}},
    series:[
      {name:'在线留言',type:'line',smooth:true,data:msg,itemStyle:{color:'#1677ff'}},
      {name:'预约到店',type:'line',smooth:true,data:store,itemStyle:{color:'#B08D57'}},
      {name:'招聘投递',type:'line',smooth:true,data:job,itemStyle:{color:'#52c41a'}},
    ]
  });
}

/* ============ 交互辅助 ============ */
async function delRow(model,id){
  if(!confirm('确认删除？')) return;
  const map={banners:'deleteBanner',highlights:'deleteHighlight',series:'deleteSeries',spaces:'deleteSpace',products:'deleteProduct',cases:'deleteCase',newsCats:'deleteNewsCat',news:'deleteNews',milestones:'deleteMilestone',jobs:'deleteJob',stores:'deleteStore',admins:'deleteAdmin',leads:'deleteLead',applies:'deleteApply'};
  try{ await A[map[model]](id); await reload(); }
  catch(e){ alert('删除失败：'+e.message); }
}
async function toggleReco(model,id){
  try{
    if(model==='products'){ const p=data.products.find(x=>x.id===id); await A.updateProduct(id,{is_recommended:!p.reco}); }
    else { const c=data.cases.find(x=>x.id===id); await A.updateCase(id,{is_recommended:!c.reco}); }
    await reload();
  }catch(e){ alert('操作失败：'+e.message); }
}

/* 推荐产品：从产品库勾选并设置排序 */
function pickRecProducts(){
  const rows=data.products.filter(p=>p.status).sort((a,b)=>a.sort-b.sort);
  if(!rows.length){ alert('产品库为空，请先在「单品管理」新增上线产品'); return; }
  const body=`<div class="form-row" style="margin-bottom:10px"><label>勾选产品并设置排序（数字越小越靠前，最多展示 4 个）</label></div>
  <div class="rec-picker">
    <table class="ant">
      <thead><tr><th width="44">勾选</th><th>产品名称</th><th>系列</th><th width="90">排序</th></tr></thead>
      <tbody>
        ${rows.map(p=>`<tr>
          <td style="text-align:center"><input type="checkbox" class="rec-check" data-id="${p.id}" ${p.reco?'checked':''} id="rec-chk-${p.id}"></td>
          <td><label for="rec-chk-${p.id}" style="cursor:pointer;margin:0">${p.name}</label></td>
          <td>${p.series||'—'}</td>
          <td><input type="number" class="ipt rec-sort" data-id="${p.id}" value="${p.reco?p.sort:''}" placeholder="-"></td>
        </tr>`).join('')}
      </tbody>
    </table>
  </div>`;
  openModal('勾选首页推荐产品',body,`<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="saveRecProducts()">保存</button>`,640);
}
async function saveRecProducts(){
  const checks=document.querySelectorAll('.rec-check');
  const sorts=document.querySelectorAll('.rec-sort');
  const map=new Map();
  checks.forEach(c=>{ map.set(+c.dataset.id,{reco:c.checked,sort:0}); });
  sorts.forEach(s=>{ const id=+s.dataset.id; const entry=map.get(id); if(entry){ entry.sort=(s.value===''||s.value===null)?0:(+s.value||0); } });
  const changes=[];
  map.forEach((v,id)=>{
    const p=data.products.find(x=>x.id===id);
    if(!p) return;
    if(!!p.reco!==v.reco || (v.reco && p.sort!==v.sort) || (!v.reco && v.sort!==0)){
      changes.push({id, is_recommended:v.reco, sort:v.reco?v.sort:0});
    }
  });
  if(!changes.length){ closeModal(); return; }
  try{
    await Promise.all(changes.map(c=>A.updateProduct(c.id,{is_recommended:c.is_recommended,sort:c.sort})));
    closeModal(); await reload();
  }catch(e){ alert('保存失败：'+e.message); }
}
function editRecProdSort(id){
  const p=data.products.find(x=>x.id===id); if(!p) return;
  openModal('设置推荐排序',`
    <input type="hidden" id="recSortId" value="${id}">
    <div class="form-row"><label>产品</label><input value="${p.name}" disabled style="background:#fafafa"/></div>
    <div class="form-row"><label>排序（数字越小越靠前）</label><input type="number" id="recSortVal" value="${p.sort}" /></div>
  `,`<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="saveRecProdSort()">保存</button>`,480);
}
async function saveRecProdSort(){
  const id=+$('recSortId').value||0; const sort=(+$('recSortVal').value)||0;
  try{ await A.updateProduct(id,{sort}); closeModal(); await reload(); }
  catch(e){ alert('保存失败：'+e.message); }
}

function openModal(title,body,foot,width){
  document.getElementById('modalTitle').textContent=title;
  document.getElementById('modalBody').innerHTML=body;
  document.getElementById('modalFoot').innerHTML=foot||'';
  const box=document.getElementById('modalBox'); box.style.width=width||'520px';
  document.getElementById('modalRoot').classList.add('show');
  initUploads(document.getElementById('modalBody'));
}
function closeModal(){ document.getElementById('modalRoot').classList.remove('show'); }
function initUploads(root){
  (root||document).querySelectorAll('.upload').forEach(el=>{
    if(el.dataset.uploadBound) return;
    el.dataset.uploadBound='1';
    // 用覆盖整个区域的透明 file input 接管点击，兼容性最好（避免隐藏 input 的 programmatic click 被浏览器拦截）
    let inp=el.querySelector('input[type=file]');
    if(!inp){
      inp=document.createElement('input');
      inp.type='file'; inp.accept='image/*';
      inp.className='file-input';
      el.appendChild(inp);
    }
    inp.addEventListener('change',e=>{
      const file=e.target.files[0]; if(!file) return;
      const url=URL.createObjectURL(file);
      el.style.backgroundImage=`url('${url}')`;
      el.style.backgroundSize='cover'; el.style.backgroundPosition='center';
      el.classList.add('has-img');
      el.dataset.fileName=file.name; el.dataset.fileSize=file.size;
      let tip=el.querySelector('.up-tip');
      if(!tip){ tip=document.createElement('span'); tip.className='up-tip'; el.appendChild(tip); }
      tip.textContent='已选择：'+file.name;
    });
  });
}
function toggleSider(){ const s=document.getElementById('sider'); s.classList.toggle('collapsed'); document.getElementById('collapseText').textContent=s.classList.contains('collapsed')?'☰ 展开':'⟨ 收起'; }
function toggleUserMenu(e){ e.stopPropagation(); document.getElementById('userMenu').classList.toggle('show'); }
document.addEventListener('click',()=>document.getElementById('userMenu').classList.remove('show'));
function logout(){ sessionStorage.clear(); window.location.href='admin-login.html'; }

/* ============ 菜单渲染与视图切换 ============ */
function renderMenu(){
  let h='';
  MENU.forEach(m=>{
    if(m.id==='dashboard'){ h+=`<div class="m-item" data-view="${m.id}" onclick="showView('${m.id}')">${m.icon} ${m.name}</div>`; return; }
    h+=`<div class="m-group ${m.open?'open':''}">
      <div class="m-title" onclick="this.parentElement.classList.toggle('open')">${m.name}<span class="chev">▶</span></div>
      <div class="m-items">${renderChildren(m.children)}</div></div>`;
  });
  document.getElementById('menu').innerHTML=h;
}
function renderChildren(children){
  let h='';
  children.forEach(c=>{
    if(c.id){ h+=`<div class="m-item" data-view="${c.id}" onclick="showView('${c.id}')">${c.name}</div>`; }
    else { h+=`<div class="m-group open"><div class="m-title" style="padding-left:24px;font-size:12px" onclick="this.parentElement.classList.toggle('open')">${c.name}<span class="chev">▶</span></div><div class="m-items">${renderChildren(c.children)}</div></div>`; }
  });
  return h;
}
function showView(key){
  currentKey=key;
  const meta=VIEW_META[key]||['',''];
  document.getElementById('breadcrumb').innerHTML=`${meta[0]} / <b>${meta[1]}</b>`;
  document.querySelectorAll('.m-item').forEach(el=>el.classList.toggle('active',el.dataset.view===key));
  document.getElementById('content').innerHTML=(VIEWS[key]||(()=>'<div class="ant-empty">模块建设中</div>'))();
  initUploads(document.getElementById('content'));
  window.scrollTo(0,0);
}

(async function init(){
  const tok=sessionStorage.getItem('tp_admin_token');
  if(!tok){ window.location.href='admin-login.html'; return; }
  const name=sessionStorage.getItem('tp_admin_name')||'admin';
  document.getElementById('uname').textContent=name;
  document.getElementById('avatar').textContent=(name[0]||'A').toUpperCase();
  const roleMap={super_admin:'超级管理员',editor:'内容编辑',kefu:'客服',hr:'招聘专员'};
  document.getElementById('urole').textContent=roleMap[sessionStorage.getItem('tp_admin_role')]||'超级管理员';
  renderMenu();
  await loadAll();          // 从后端加载数据（后端不可达时保留内置 mock）
  showView('dashboard');
})();
</script>
