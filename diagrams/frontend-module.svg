<svg viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg" width="100%"><title>前台系统模块架构图</title><defs><marker id="mk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 2L8 5L1 8" fill="none" stroke="#B08D57" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="mk2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 2L8 5L1 8" fill="none" stroke="#888888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="340" y="26" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="500" fill="#1A1714">前台系统模块架构图（monorepo · web + admin + api-client）</text><g><rect x="30" y="60" width="300" height="300" rx="10" fill="#FBFAF7" stroke="#B08D57" stroke-width="1.5"/><rect x="30" y="60" width="300" height="26" rx="10" fill="#B08D57"/><rect x="30" y="74" width="300" height="12" fill="#B08D57"/><text x="42" y="78" font-family="sans-serif" font-size="13" font-weight="500" fill="#fff">前台 web · React + Tailwind</text><circle cx="46" cy="100" r="3" fill="#B08D57"/><text x="56" y="104" font-family="sans-serif" font-size="11" fill="#1A1714">页面：Home / Products / Cases / News / About / Recruitment</text><circle cx="46" cy="119" r="3" fill="#B08D57"/><text x="56" y="123" font-family="sans-serif" font-size="11" fill="#1A1714">公共组件：导航 / 页脚 / 卡片 / 筛选 chip / 弹窗 / 在线客服</text><circle cx="46" cy="138" r="3" fill="#B08D57"/><text x="56" y="142" font-family="sans-serif" font-size="11" fill="#1A1714">设计令牌：Tailwind 扩展 gold/ink/sand/line（UI/UX §3）</text><circle cx="46" cy="157" r="3" fill="#B08D57"/><text x="56" y="161" font-family="sans-serif" font-size="11" fill="#1A1714">路由：React Router（hash 或 History）</text><circle cx="46" cy="176" r="3" fill="#B08D57"/><text x="56" y="180" font-family="sans-serif" font-size="11" fill="#1A1714">状态：Zustand</text><circle cx="46" cy="195" r="3" fill="#B08D57"/><text x="56" y="199" font-family="sans-serif" font-size="11" fill="#1A1714">动效：Hero Ken Burns + 建筑索引条</text></g><g><rect x="350" y="60" width="300" height="300" rx="10" fill="#FBFAF7" stroke="#B08D57" stroke-width="1.5"/><rect x="350" y="60" width="300" height="26" rx="10" fill="#B08D57"/><rect x="350" y="74" width="300" height="12" fill="#B08D57"/><text x="362" y="78" font-family="sans-serif" font-size="13" font-weight="500" fill="#fff">后台 admin · React + Ant Design</text><circle cx="366" cy="100" r="3" fill="#B08D57"/><text x="376" y="104" font-family="sans-serif" font-size="11" fill="#1A1714">视图：首页配置 / 产品 / 案例 / 新闻 / 招聘 / 线索 / 系统</text><circle cx="366" cy="119" r="3" fill="#B08D57"/><text x="376" y="123" font-family="sans-serif" font-size="11" fill="#1A1714">组件库：Ant Design 5（表格/表单/弹窗/分页）</text><circle cx="366" cy="138" r="3" fill="#B08D57"/><text x="376" y="142" font-family="sans-serif" font-size="11" fill="#1A1714">看板：ECharts（留言/预约/投递趋势）</text><circle cx="366" cy="157" r="3" fill="#B08D57"/><text x="376" y="161" font-family="sans-serif" font-size="11" fill="#1A1714">富文本：WangEditor（图片走统一上传）</text><circle cx="366" cy="176" r="3" fill="#B08D57"/><text x="376" y="180" font-family="sans-serif" font-size="11" fill="#1A1714">权限：usePerm 指令（菜单级 + 按钮级）</text><circle cx="366" cy="195" r="3" fill="#B08D57"/><text x="376" y="199" font-family="sans-serif" font-size="11" fill="#1A1714">状态：轻量 Context</text></g><g><rect x="30" y="390" width="620" height="110" rx="10" fill="#FBFAF7" stroke="#B08D57" stroke-width="1.5"/><rect x="30" y="390" width="620" height="26" rx="10" fill="#B08D57"/><rect x="30" y="404" width="620" height="12" fill="#B08D57"/><text x="42" y="408" font-family="sans-serif" font-size="13" font-weight="500" fill="#fff">共享 api-client（前后台共用）</text><circle cx="46" cy="430" r="3" fill="#B08D57"/><text x="56" y="434" font-family="sans-serif" font-size="11" fill="#1A1714">Axios 封装：基址 127.0.0.1:8000，统一拦截</text><circle cx="46" cy="449" r="3" fill="#B08D57"/><text x="56" y="453" font-family="sans-serif" font-size="11" fill="#1A1714">Token 刷新：access 过期用 refresh 换发，401 跳登录</text><circle cx="46" cy="468" r="3" fill="#B08D57"/><text x="56" y="472" font-family="sans-serif" font-size="11" fill="#1A1714">SEED 兜底：后端不可达返回本地静态数据</text><circle cx="46" cy="487" r="3" fill="#B08D57"/><text x="56" y="491" font-family="sans-serif" font-size="11" fill="#1A1714">类型共享：前后台共用 TS 类型定义</text></g><line x1="180" y1="360" x2="180" y2="390" stroke="#888888" stroke-width="1.6" marker-end="url(#mk2)"/><line x1="500" y1="360" x2="500" y2="390" stroke="#888888" stroke-width="1.6" marker-end="url(#mk2)"/><rect x="150" y="366" width="64" height="16" fill="#FFFFFF"/><text x="182" y="378" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1A1714">HTTPS /api</text><rect x="470" y="366" width="64" height="16" fill="#FFFFFF"/><text x="502" y="378" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1A1714">HTTPS /api</text></svg>